name: Temporary 7Commander branding gates
on:
  push:
    branches:
      - chore/brand-commander-20261118
    paths:
      - .github/workflows/temporary-brand-gates.yml
permissions:
  contents: write
jobs:
  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/brand-commander-20261118
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
