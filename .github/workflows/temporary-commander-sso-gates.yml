name: Temporary Commander SSO fix gates
on:
  push:
    branches:
      - fix/portal-sso-bootstrap-entitlements-20261118
permissions:
  contents: read
jobs:
  sso-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/portal-sso-bootstrap.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
