name: INT-01 release security gates
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  int01-security-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: INT-01 central permission and tenant isolation
        run: node --test tests/int01-release-security.test.mjs tests/commander-central-policy.test.mjs tests/central-route-policy.test.mjs tests/int01-pilot-viewer-ui.test.mjs
      - name: All INT-01 node tests
        run: node --test tests/*.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
