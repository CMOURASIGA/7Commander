name: Develop validation
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: develop-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
