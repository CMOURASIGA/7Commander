name: Temporary Scrum VIEWER checks
on:
  push:
    branches:
      - fix/scrum-viewer-read-policy-20261118
permissions:
  contents: read
jobs:
  scrum-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/central-scrum-viewer-read.test.mjs tests/central-route-policy.test.mjs tests/central-route-policy-r3.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
